application:
  kafka:
    topic: booktracker.events

spring:
  output:
    ansi:
      enabled: always
  kafka:
    client-id: ${spring.application.name}
    listener:
      ack-mode: manual
    bootstrap-servers: localhost:9095
    consumer:
      group-id: booktracker-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      isolation-level: read_committed
